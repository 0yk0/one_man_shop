version: '3'

vars:
  APP_NAME: "one_man_shop"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

tasks:
  build:
    summary: Builds the application for the current platform
    cmds:
      - task: '{{if eq OS "darwin"}}darwin:build{{else if eq OS "windows"}}windows:build{{else}}build:unsupported{{end}}'

  build:unsupported:
    summary: Unsupported platform
    preconditions:
      - sh: test {{OS}} = unsupported
        msg: Building on {{OS}} is not supported. Use macOS or Windows.

  package:
    summary: Packages a production build of the application for the current platform
    cmds:
      - task: '{{if eq OS "darwin"}}darwin:package{{else if eq OS "windows"}}windows:package{{else}}package:unsupported{{end}}'

  package:unsupported:
    summary: Unsupported platform
    preconditions:
      - sh: test {{OS}} = unsupported
        msg: Packaging on {{OS}} is not supported. Use macOS or Windows.

  run:
    summary: Runs the application for the current platform
    cmds:
      - task: '{{if eq OS "darwin"}}darwin:run{{else if eq OS "windows"}}windows:run{{else}}run:unsupported{{end}}'

  run:unsupported:
    summary: Unsupported platform
    preconditions:
      - sh: test {{OS}} = unsupported
        msg: Running on {{OS}} is not supported. Use macOS or Windows.

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    summary: Runs all tests (Go backend + frontend unit + E2E)
    cmds:
      - task: test:go
      - task: test:frontend
      - task: test:e2e

  test:go:
    summary: Runs Go backend tests
    cmds:
      - go test ./backend/... -v -race

  test:frontend:
    summary: Runs frontend unit tests with Vitest
    dir: frontend
    cmds:
      - npx vitest run

  test:e2e:
    summary: Runs E2E tests with Playwright
    dir: frontend
    cmds:
      - npx playwright test
