version: '3'

vars:
  APP_NAME: "one_man_shop"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: darwin:build

  package:
    summary: Packages a production build of the application
    cmds:
      - task: darwin:package

  run:
    summary: Runs the application
    cmds:
      - task: darwin:run

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    summary: Runs all tests (Go backend + frontend unit + E2E)
    cmds:
      - task: test:go
      - task: test:frontend
      - task: test:e2e

  test:go:
    summary: Runs Go backend tests
    cmds:
      - go test ./backend/... -v -race

  test:frontend:
    summary: Runs frontend unit tests with Vitest
    dir: frontend
    cmds:
      - npx vitest run

  test:e2e:
    summary: Runs E2E tests with Playwright
    dir: frontend
    cmds:
      - npx playwright test
