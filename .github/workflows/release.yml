name: Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: one_man_shop_macos_arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact: one_man_shop_macos_amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
            artifact: one_man_shop_windows_amd64
          - os: windows-latest
            goos: android
            goarch: arm64
            artifact: one_man_shop_android

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # ── Android-specific setup ──────────────────────────────────────
      - name: Setup Java
        if: matrix.goos == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        if: matrix.goos == 'android'
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: >-
            platform-tools
            build-tools;35.0.0
            platforms;android-35
            ndk;26.3.11579264
      # ────────────────────────────────────────────────────────────────

      - name: Cache Wails binary
        id: cache-wails
        uses: actions/cache@v5
        with:
          path: ~/go/bin/wails3
          key: wails3-${{ runner.os }}-${{ runner.arch }}-v3.0.0-alpha2.120

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        shell: bash
        env:
          GOPROXY: https://proxy.golang.org,direct
          GONOSUMCHECK: '*'
          GONOSUMDB: '*'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.120

      - name: Remove .npmrc age gate
        shell: bash
        run: rm -f frontend/.npmrc

      # ── Desktop build (unchanged from original) ────────────────────
      - name: Build
        if: matrix.goos != 'android'
        shell: bash
        run: wails3 task build

      - name: Package macOS .app
        if: matrix.goos == 'darwin'
        shell: bash
        run: wails3 task darwin:create:app:bundle

      - name: Upload macOS artifact
        if: matrix.goos == 'darwin'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: bin/

      - name: Upload Windows artifact
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: bin/
      # ────────────────────────────────────────────────────────────────

      # ── Android build ──────────────────────────────────────────────
      - name: Build frontend
        if: matrix.goos == 'android'
        shell: bash
        working-directory: frontend
        run: npm ci && npm run build

      - name: Generate Android overlay
        if: matrix.goos == 'android'
        shell: bash
        run: wails3 task android:generate:android:overlay

      - name: Compile Go shared library (arm64)
        if: matrix.goos == 'android'
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: arm64
          PRODUCTION: "true"
        run: |
          NDK_ROOT=$(ls -d "$ANDROID_HOME/ndk/"* 2>/dev/null | sort -V | tail -1)
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/windows-x86_64"
          export CC="$TOOLCHAIN/bin/aarch64-linux-android21-clang.cmd"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android21-clang++.cmd"
          mkdir -p build/android/app/src/main/jniLibs/arm64-v8a
          go build -buildmode=c-shared \
            -overlay build/android/overlay.json \
            -tags production,android -trimpath -buildvcs=false -ldflags="-w -s" \
            -o build/android/app/src/main/jniLibs/arm64-v8a/libwails.so

      - name: Assemble release APK
        if: matrix.goos == 'android'
        shell: bash
        working-directory: build/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload Android artifact
        if: matrix.goos == 'android'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build/android/app/build/outputs/apk/release/app-release.apk
      # ────────────────────────────────────────────────────────────────

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -E '^  version:' build/config.yml | awk '{print $2}' | tr -d "\"'")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          mkdir -p release
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            cd "$name"
            zip -r "../../release/${name}.zip" *
            cd ..
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "one_man_shop_${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: release/*
          draft: false
          prerelease: false
