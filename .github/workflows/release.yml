name: Release Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: one_man_shop_macos_arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact: one_man_shop_macos_amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
            artifact: one_man_shop_windows_amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: one_man_shop_linux_amd64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Linux build dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Cache Wails binary
        id: cache-wails
        uses: actions/cache@v5
        with:
          path: ~/go/bin/wails3
          key: wails3-${{ runner.os }}-${{ runner.arch }}-v3.0.0-alpha2.120

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        shell: bash
        env:
          GOPROXY: https://proxy.golang.org,direct
          GONOSUMCHECK: '*'
          GONOSUMDB: '*'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.120

      - name: Remove .npmrc age gate
        shell: bash
        run: rm -f frontend/.npmrc

      # Build binary (handles frontend, bindings, icons, compilation)
      - name: Build
        shell: bash
        run: wails3 task build

      # macOS: package into .app bundle with code signing
      - name: Package macOS .app
        if: matrix.goos == 'darwin'
        shell: bash
        run: wails3 task darwin:create:app:bundle

      # Linux: create AppImage
      - name: Package Linux AppImage
        if: matrix.goos == 'linux'
        shell: bash
        run: wails3 task linux:create:appimage

      # Strip quarantine flag so the app launches when downloaded from GitHub
      - name: Remove quarantine (macOS)
        if: matrix.goos == 'darwin'
        shell: bash
        run: xattr -dr com.apple.quarantine bin/*.app

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            bin/*.app/**
            bin/${{ matrix.artifact }}${{ matrix.ext }}
            bin/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -E '^  version:' build/config.yml | awk '{print $2}' | tr -d "\"'")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          mkdir -p release
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            cd "$name"
            zip "../../release/${name}.zip" *
            cd ..
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "one_man_shop_${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: release/*
          draft: false
          prerelease: false
