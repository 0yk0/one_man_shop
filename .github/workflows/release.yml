name: Release Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: ""
            ext: ""
            artifact: one_man_shop_release_macos_arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            suffix: "-amd64"
            ext: ""
            artifact: one_man_shop_release_macos_amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            suffix: "-windows-amd64"
            ext: ".exe"
            artifact: one_man_shop_release_windows_amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: "-linux-amd64"
            ext: ""
            artifact: one_man_shop_release_linux_amd64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Authenticate git for GitHub
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Linux build dependencies
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkit2gtk-6.0-dev

      - name: Cache Wails binary
        id: cache-wails
        uses: actions/cache@v5
        with:
          path: ~/go/bin/wails3
          key: wails3-${{ runner.os }}-${{ runner.arch }}-v3.0.0-alpha2.120

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        env:
          GOPROXY: https://proxy.golang.org,direct
          GONOSUMCHECK: '*'
          GONOSUMDB: '*'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.120

      - name: Remove .npmrc age gate
        run: rm -f frontend/.npmrc

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Generate bindings
        run: wails3 generate bindings -clean=true -ts -i

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'linux' && '1' || '0' }}
        run: |
          go build -tags production -trimpath -buildvcs=false \
            -ldflags="-w -s" \
            -o bin/${{ matrix.artifact }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.artifact }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version:' build/config.yml | head -1 | awk '{print $2}' | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          mkdir -p release
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            cd "$name"
            zip "../../release/${name}.zip" *
            cd ..
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "one_man_shop_${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: release/*
          draft: false
          prerelease: false
