name: Beta Build

on:
  push:
    branches-ignore: [main]

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: ""
            ext: ""
            artifact: one_man_shop_beta_macos_arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            suffix: "-amd64"
            ext: ""
            artifact: one_man_shop_beta_macos_amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            suffix: "-windows-amd64"
            ext: ".exe"
            artifact: one_man_shop_beta_windows_amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: "-linux-amd64"
            ext: ""
            artifact: one_man_shop_beta_linux_amd64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Linux build dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Cache Wails binary
        id: cache-wails
        uses: actions/cache@v5
        with:
          path: ~/go/bin/wails3
          key: wails3-${{ runner.os }}-${{ runner.arch }}-v3.0.0-alpha2.120

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        shell: bash
        env:
          GOPROXY: https://proxy.golang.org,direct
          GONOSUMCHECK: '*'
          GONOSUMDB: '*'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.120

      - name: Remove .npmrc age gate
        shell: bash
        run: rm -f frontend/.npmrc

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Generate bindings
        shell: bash
        run: wails3 generate bindings -clean=true -ts -i

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'windows' && '0' || '1' }}
          BUILD_TAGS: production
        run: |
          go build -tags "$BUILD_TAGS" -trimpath -buildvcs=false -ldflags="-w -s" -o "bin/${{ matrix.artifact }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.artifact }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -E '^  version:' build/config.yml | awk '{print $2}' | tr -d "\"'")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          mkdir -p release
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            cd "$name"
            zip "../../release/${name}.zip" *
            cd ..
          done

      - name: Generate beta tag
        id: tag
        run: |
          VERSION=${{ steps.version.outputs.version }}
          TAG="v${VERSION}-beta.${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create Beta Pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "one_man_shop_${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          files: release/*
          draft: false
          prerelease: true
